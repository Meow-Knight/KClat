[package]
name = "klat-core"
version = "0.1.0"
description = "Klat's rules, with no Tauri, no I/O and no clock: which sessions need you, when the cat wakes"
edition = "2021"
publish = false

# docs/ARCHITECTURE.md §4.1: no tauri, no I/O crates. Time comes in as an argument (clippy.toml forbids reading it).
[dependencies]
klat-protocol = { workspace = true }
serde = { workspace = true }
# preserve_order: Install and Uninstall keep the keys of people's settings.json in their order, also when
# klat-core is built on its own (`cargo test -p klat-core`).
serde_json = { workspace = true, features = ["preserve_order"] }
ts-rs = { workspace = true, optional = true }

[features]
# TypeScript declarations of the types that cross IPC (src-tauri's tests write src/bridge/generated.ts).
ts = ["dep:ts-rs", "klat-protocol/ts"]

[lints]
workspace = true
