[package]
name = "klat-infra"
version = "0.1.0"
description = "Klat's I/O without Tauri: the log, the event server, runtime.json, settings files"
edition = "2021"
license = "MIT"
publish = false

# docs/ARCHITECTURE.md §4.1: may use the file system, sockets and threads; never tauri.
[dependencies]
getrandom = { workspace = true }
klat-core = { workspace = true }
klat-protocol = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
ts-rs = { workspace = true, optional = true }

[features]
# TypeScript declarations of the types that cross IPC (src-tauri's tests write src/bridge/generated.ts).
ts = ["dep:ts-rs", "klat-core/ts"]

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
