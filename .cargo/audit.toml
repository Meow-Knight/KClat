# cargo audit configuration. Every ignored advisory needs a reason that still holds; re-check them when Tauri is
# updated (`cargo tree -i <crate> --target x86_64-pc-windows-msvc` and `--target aarch64-apple-darwin` must print
# nothing).
[advisories]
ignore = [
  # glib 0.18.5: unsound VariantStrIter. Only in Tauri's GTK stack, built for Linux only; Klat ships for
  # Windows and macOS.
  "RUSTSEC-2024-0429",
  # proc-macro-error 1.0.4: unmaintained, a build-time macro of glib-macros (same Linux-only GTK stack).
  "RUSTSEC-2024-0370",
]
