<!doctype html><html><head><meta charset="utf-8"><style>:root{--surface-2:#fff;--text-primary:#222;--text-secondary:#666}body{font-family:sans-serif;width:680px;margin:20px auto}.sr-only{position:absolute;left:-9999px}</style></head><body>
<style>

<div id="cw" class="sleep">
<canvas id="cv"></canvas>

</div>

</div>

<script type="module">

function sp(n,v,k,d){P[n]={v,vel:0,t:v,k,d}}

let state='sleep',jy=0,jv=0,tapping=false,purrUntil=0,eyeBase=.02,yellT=null,timers=[];
const later=(ms,f)=>timers.push(setTimeout(f,ms));
function clearT(){timers.forEach(clearTimeout);timers=[];clearInterval(yellT)}
function yell(first){if(state!=='active')return;btxt.textContent=first?PHRASES[0]:nextPhrase();bub.classList.add('show');bub.classList.remove('shake');void bub.offsetWidth;bub.classList.add('shake');P.mouth.t=1;P.grumpy.t=0;P.eye.t=1.25;P.eye.vel+=6;P.ear.vel+=6;P.tailUp.t=1;if(!first){jv=2.6;P.squash.vel+=2}later(1100,()=>{if(state!=='active')return;P.mouth.t=0;P.grumpy.t=1;eyeBase=.62;P.eye.t=eyeBase;P.tailUp.t=.4})}

later(1000,()=>{wrap.className='sleep';P.mouth.t=0;P.yawn.t=0;P.sleepy.t=1;P.ear.t=.3;eyeBase=.02;P.eye.t=.02;P.grumpy.t=.3})}
document.getElementById('bWake').onclick=wake;document.getElementById('bSleep').onclick=sleep;
document.getElementById('bNext').onclick=()=>{if(state==='active'){clearInterval(yellT);yell(false);yellT=setInterval(()=>yell(false),6500)}else wake()};
const hv=new THREE.Vector3();

cv.addEventListener('click',()=>{if(state==='active'){P.happy.t=1;purrUntil=performance.now()+1300;later(1300,()=>P.happy.t=0)}else{P.eye.t=.4;P.earTw.vel+=9;later(900,()=>{if(state==='sleep')P.eye.t=.02})}});
(function blink(){setTimeout(()=>{if(state==='active'&&P.happy.t<.5&&P.mouth.t<.5){P.eye.t=.03;setTimeout(()=>{if(state==='active')P.eye.t=eyeBase},110)}blink()},1600+Math.random()*3400)})();

eyes.forEach(e=>{e.ig.visible=!happy&&!closed;e.sa.visible=closed;e.ha.visible=happy;e.ig.scale.set(1+Math.max(0,ev-1)*.6,Math.max(.04,Math.min(1.35,ev)),1);
