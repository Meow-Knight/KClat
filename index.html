<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Klat</title>
    <style>
      /* The overlay window is transparent: nothing here may paint a background. */
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        user-select: none;
      }
      #stage {
        width: 100%;
        height: 100%;
        /* Size slider preview (src/overlay/main.ts): the cat stands in the bottom-right corner. */
        transform-origin: 100% 100%;
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <script type="module" src="/src/overlay/main.ts"></script>
  </body>
</html>
