# Builds the Windows installer (`pnpm release`) and the universal macOS .dmg (`pnpm release:mac`) on GitHub runners.
#
#   - Actions tab → "Release" → Run workflow: builds both and keeps them as workflow artifacts.
#   - Push a tag v<version> (the version in src-tauri/tauri.conf.json): also attaches Klat_<version>_x64-setup.exe,
#     Klat_<version>_universal.dmg and one SHA256SUMS.txt to a draft GitHub release, which you publish by hand.
#
# Neither build is code-signed, like a local build (the .dmg is ad-hoc signed and not notarized). For a Developer ID
# signature on macOS, add the repository secrets APPLE_CERTIFICATE (base64 .p12), APPLE_CERTIFICATE_PASSWORD,
# APPLE_SIGNING_IDENTITY and, to notarize, APPLE_ID, APPLE_PASSWORD (app-specific), APPLE_TEAM_ID: Tauri picks them up
# from the environment of the macOS build step.
# Third-party actions are pinned to a commit (the tag in the comment): a moved tag cannot change what runs here.
name: Release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Tag matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match tauri.conf.json version $version"
            exit 1
          fi

  windows:
    needs: version
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      NSIS_DIR: target/release/bundle/nsis
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # pnpm version comes from packageManager in package.json.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - run: pnpm install --frozen-lockfile
      - run: pnpm release

      - name: Check the bundle
        shell: bash
        run: |
          ls -l "$NSIS_DIR"
          cat "$NSIS_DIR/SHA256SUMS.txt"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: klat-windows-x64
          path: |
            ${{ env.NSIS_DIR }}/Klat_*-setup.exe
            ${{ env.NSIS_DIR }}/SHA256SUMS.txt
          if-no-files-found: error

  macos:
    needs: version
    runs-on: macos-15
    timeout-minutes: 60
    env:
      DMG_DIR: target/universal-apple-darwin/release/bundle/dmg
      APP: target/universal-apple-darwin/release/bundle/macos/Klat.app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - run: pnpm install --frozen-lockfile

      # Tauri imports APPLE_CERTIFICATE into a temporary keychain itself. Unset secrets arrive as empty strings, and an
      # empty APPLE_SIGNING_IDENTITY would override the ad-hoc "-" in tauri.macos.conf.json, so drop the empty ones.
      - name: Build the universal .dmg
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          [ -n "$APPLE_CERTIFICATE" ] || unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD
          [ -n "$APPLE_SIGNING_IDENTITY" ] || unset APPLE_SIGNING_IDENTITY
          [ -n "$APPLE_ID" ] || unset APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
          pnpm release:mac

      - name: Check the bundle
        run: |
          archs=$(lipo -archs "$APP/Contents/MacOS/klat-hook")
          echo "klat-hook: $archs"
          case "$archs" in *x86_64*arm64*|*arm64*x86_64*) ;; *) echo "::error::klat-hook is not universal"; exit 1 ;; esac
          codesign -dv "$APP" 2>&1 | grep -E 'Identifier|Signature|TeamIdentifier'
          ls -l "$DMG_DIR"
          cat "$DMG_DIR/SHA256SUMS.txt"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: klat-macos-universal
          path: |
            ${{ env.DMG_DIR }}/Klat_*.dmg
            ${{ env.DMG_DIR }}/SHA256SUMS.txt
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: klat-*
          path: dist
      - name: Attach to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # One SHA256SUMS.txt for both files: the README tells users to check the download against it.
          cat dist/*/SHA256SUMS.txt > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --draft --title "Klat $GITHUB_REF_NAME" \
              --notes "Windows: Klat_*_x64-setup.exe. macOS (Apple Silicon and Intel): Klat_*_universal.dmg, first open: docs/macos-install.md. Check downloads against SHA256SUMS.txt."
          gh release upload "$GITHUB_REF_NAME" dist/*/*.exe dist/*/*.dmg SHA256SUMS.txt --clobber
