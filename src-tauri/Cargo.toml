[package]
name = "klat"
version = "0.1.0"
description = "Grumpy desktop cat that yells when Claude Code needs you"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
tauri = { version = "2.12.2", features = ["tray-icon", "macos-private-api"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
getrandom = "0.3.4"
tauri-plugin-dialog = "2.8.2"
tauri-plugin-single-instance = "2.5.3"
tauri-plugin-autostart = "2.7.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_System_LibraryLoader",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3.27.0"
