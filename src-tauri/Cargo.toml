[package]
name = "klat"
version = "0.1.0"
description = "Grumpy desktop cat that yells when Claude Code needs you"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
tauri = { version = "2.12.2", features = ["tray-icon", "macos-private-api"] }
klat-core = { workspace = true }
klat-infra = { workspace = true }
klat-protocol = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["preserve_order"] }
tauri-plugin-dialog = "2.8.2"
tauri-plugin-single-instance = "2.5.3"
tauri-plugin-autostart = "2.7.0"

# The macOS Space hook (platform/macos.rs). Same versions Tauri already pulls in.
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "=0.10.1"
core-graphics = "=0.25.0"

[target.'cfg(windows)'.dependencies]
# The webview's memory target (platform/webview_memory.rs). Same versions Tauri already pulls in.
webview2-com = "=0.39.1"
windows-core = "=0.62.2"
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_System_LibraryLoader",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = { workspace = true }
