[workspace]
resolver = "2"
members = ["src-tauri", "crates/klat-protocol", "crates/klat-core", "crates/klat-infra", "crates/klat-hook"]

# One version for what several crates use. A crate opts in with `x = { workspace = true }`.
[workspace.dependencies]
getrandom = "0.3.4"
klat-core = { path = "crates/klat-core" }
klat-infra = { path = "crates/klat-infra" }
klat-protocol = { path = "crates/klat-protocol" }
# The facade only; klat-infra::log is the logger. Same version Tauri already pulls in.
log = { version = "0.4.34", features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"

# For crates that opt in with `[lints] workspace = true`; src-tauri does not (its platform code needs unsafe).
[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
# The hook adapter runs on every Claude Code hook: keep it small and quick to start.
lto = true
codegen-units = 1
